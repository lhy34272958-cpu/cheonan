<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>김장 나눔 | 웹 카드뉴스</title><meta name="description" content="11월 5일, 봉사인원 20명, 50가구를 위한 따뜻한 김장 나눔 카드뉴스"><style>
:root{color-scheme:light;--ink:#633d35;--accent:#bd5648;--paper:#fff9f2;--blush:#fff0e9}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:linear-gradient(145deg,#fff5ed,#f1f7fb);color:var(--ink)}main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 12px 30px;gap:13px}.header{text-align:center}.header h1{font-size:clamp(22px,4vw,31px);margin:0 0 5px;font-weight:850}.header p{margin:0;color:#97695f;font-size:14px}.frame{width:min(100%,480px);position:relative}.slide{width:100%;border-radius:21px;box-shadow:0 14px 42px #6c4c3d2d;display:block;aspect-ratio:4/5;object-fit:contain;background:white}.toolbar{display:flex;justify-content:space-between;align-items:center;width:min(100%,480px);gap:12px}.nav{min-width:85px;padding:11px 16px;border-radius:999px;border:1px solid #ebc8bb;color:#793e31;background:white;cursor:pointer;font-size:15px;font-weight:750}.nav:hover{background:var(--blush)}.nav:disabled{opacity:.35;cursor:not-allowed}.dots{display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border:none;background:#d9c1b8;border-radius:50%;padding:0;cursor:pointer}.dot.active{background:var(--accent);width:25px;border-radius:10px}.caption{font-size:14px;font-weight:750;text-align:center;min-height:1.5em}.count{font-size:12px;color:#987970}.hint{font-size:12px;color:#9c7970;text-align:center}@media(max-height:850px){main{justify-content:flex-start}.frame{width:min(100%, min(52vh,440px))}}@media(prefers-reduced-motion:no-preference){.slide{animation:enter .23s ease-out}@keyframes enter{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}}</style></head><body><main><div class="header"><h1>김장 나눔 이야기</h1><p>11월 5일 · 봉사자 20명 · 나눔 대상 50가구</p></div><div class="frame"><img class="slide" id="slide" alt="김장 나눔 카드뉴스 1장" draggable="false"></div><div class="caption" id="title"></div><div class="toolbar"><button class="nav" id="prev" aria-label="이전 카드">← 이전</button><div class="dots" id="dots" aria-label="카드 선택"></div><button class="nav" id="next" aria-label="다음 카드">다음 →</button></div><div class="count" id="count" aria-live="polite"></div><div class="hint">좌우 화살표 키 또는 화면을 밀어서 넘길 수 있습니다.</div></main><script>
const images=["images/김장나눔_카드뉴스_01.png","images/김장나눔_카드뉴스_02.png","images/김장나눔_카드뉴스_03.png","images/김장나눔_카드뉴스_04.png","images/김장나눔_카드뉴스_05.png"];const titles=["따뜻한 겨울, 사랑을 버무리다", "나눔의 하루를 소개합니다", "한 포기마다 담은 정성", "이웃의 문 앞까지 전하는 온기", "함께여서 더 따뜻한 하루"];let current=0;const el=document.getElementById('slide'),dots=document.getElementById('dots');images.forEach((_,i)=>{let b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',(i+1)+'장 보기');b.onclick=()=>show(i);dots.appendChild(b)});function show(i){current=Math.max(0,Math.min(i,images.length-1));el.src=images[current];el.alt='김장 나눔 카드뉴스 '+(current+1)+'장: '+titles[current];document.getElementById('title').textContent=titles[current];document.getElementById('count').textContent=(current+1)+' / '+images.length;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===images.length-1;Array.from(dots.children).forEach((d,n)=>{d.classList.toggle('active',n===current);d.setAttribute('aria-current',n===current?'true':'false')})}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});let x0=null;el.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(x0===null)return;let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45)show(current+(dx<0?1:-1));x0=null},{passive:true});show(0);
</script></body></html>
